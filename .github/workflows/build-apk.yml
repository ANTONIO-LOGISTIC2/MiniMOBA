name: Build Android APK

# Runs on every push to main that touches the game or Android project,
# on manual trigger, and on version tags (v*.*.*) — tag pushes also
# attach the APK to a GitHub Release (see the release job below).
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch: {}

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        # Installs cmdline-tools, platform-tools, and accepts SDK licenses.
        # Android Gradle Plugin will auto-download the specific
        # compileSdk/build-tools versions this project needs during the
        # Gradle build itself, using the licenses this step accepts.

      - name: Install npm dependencies
        run: npm install

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Locate built APK
        id: apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          if [ -z "$APK_PATH" ]; then
            echo "No APK found - build did not produce an output file."
            exit 1
          fi
          cp "$APK_PATH" MiniMOBA-debug.apk
          echo "path=MiniMOBA-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiniMOBA-debug-apk
          path: MiniMOBA-debug.apk
          if-no-files-found: error
          retention-days: 30

    outputs:
      apk_path: MiniMOBA-debug.apk

  # Dormant until you push a version tag (e.g. `git tag v1.0.0 && git push origin v1.0.0`).
  # When that happens, this job re-downloads the APK artifact built above and
  # attaches it to a new GitHub Release automatically. Not run on normal
  # branch pushes or manual runs - safe to leave in place.
  release:
    name: Attach APK to GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: MiniMOBA-debug-apk

      - name: Create GitHub Release with APK attached
        uses: softprops/action-gh-release@v2
        with:
          files: MiniMOBA-debug.apk
          generate_release_notes: true
